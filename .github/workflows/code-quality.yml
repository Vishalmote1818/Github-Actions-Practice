#Code Quality: SASST
name: Code Quality - SAST

on:
  workflow_call:

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout Source Code
      - name: Code Checkout
        uses: actions/checkout@v7

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Step 3: Install Semgrep
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # Step 4: Run SAST Scan
      - name: Run SAST using Semgrep
        run: |
          semgrep scan --config auto --error .
