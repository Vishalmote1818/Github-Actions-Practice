# What is the goal of workflow
#Goal: Whenever someone changes the python code the linter will check if the syntax, format, indentation (Linting) is correct or not..

name: Auto Linter

on:
  push:
    paths: "**.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    #This step will automatically clone the code of the brach into runnner..
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout/@v7

        #This step will install the linting tool
      - name: install Linter
        run: pip install ruff

        # Step 3: Run the linter
      - name: Check files for linting
        run: ruff check .
        
    
