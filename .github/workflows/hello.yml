
# Workflow
# Every workflow should have a name
name: Hello

# on tells when the workflow runs
# workflow_dispatch allows us to trigger the workflow manually
on:
  workflow_dispatch:

# Jobs
# Jobs tells what the workflow should do.
# A workflow can have one or more jobs.
# Jobs is an object, so we need proper indentation.
jobs:

  # Job name
  say-hello:

    # Creates an ephemeral runner environment with Ubuntu running
    runs-on: ubuntu-latest

    # Steps
    # An ephemeral runner executes the steps defined below.
    # Each step should have a name and a command to execute.

    steps:

      # Name of the step
      - name: Say hello to everyone

        # run executes the command inside the runner
        run: echo "Hello Dosto"

# Steps should be inside a job.
# Actions are reusable units of code that can be used inside steps.
